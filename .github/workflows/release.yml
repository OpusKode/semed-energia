name: Build e Release (Windows)

# Dispara quando você publica uma tag de versão, ex.: v1.0.1
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # necessário para criar a release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Conferir se a tag bate com version.py
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = python -c "import version; print(version.__version__)"
          if ($tag -ne $ver) {
            Write-Error "A tag ($tag) nao bate com version.py ($ver). Atualize version.py antes de marcar a tag."
            exit 1
          }

      - name: Gerar executável (PyInstaller)
        run: pyinstaller semed.spec --noconfirm

      - name: Compactar pacote de atualização
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/SEMED Energia" -DestinationPath "SEMED-Energia-windows.zip" -Force

      - name: Publicar release com o pacote
        uses: softprops/action-gh-release@v2
        with:
          name: "SEMED Energia ${{ github.ref_name }}"
          files: SEMED-Energia-windows.zip
          generate_release_notes: true
